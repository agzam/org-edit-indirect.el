---
name: Run Tests
on: [push, pull_request, workflow_dispatch]  # yamllint disable-line rule:truthy
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['29.4', '31.1']
    steps:
      - name: Check out
        uses: actions/checkout@main

      - name: Cache nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ matrix.emacs-version }}

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: .elpa
          key: elpa-${{ matrix.emacs-version }}-${{ hashFiles('Makefile') }}

      - name: Install dependencies
        run: make deps

      - name: Run unit tests
        run: make test

      - name: Run E2E tests
        run: make test-e2e
        timeout-minutes: 10

      - name: Lint
        run: make lint

      - name: Check byte-compilation
        run: make check-compile
